name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-pipeline:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Artifacts
        run: |
          cd frontend
          npm run build

  backend-pipeline:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --bind_ip_all
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8

      - name: Code Quality & Syntax Check
        run: |
          cd backend
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Initiate MongoDB Replica Set
        run: |
          docker exec $(docker ps -q --filter "ancestor=mongo:6.0" | head -n 1) mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})" || true
          sleep 2

      - name: Run Backend Tests (Unit, Service, & Integration)
        env:
          MONGODB_URL: mongodb://localhost:27017/test_db?directConnection=true
          MONGODB_DB_NAME: test_db
          SECRET_KEY: test_secret_key_for_ci_pipeline_only_32_chars
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -o asyncio_mode=auto -v

  security-scan:
    name: Dependency & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Security Check Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pip-audit || true
          pip-audit -r requirements.txt || true
